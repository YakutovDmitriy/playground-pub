<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>2k48 game</title>

    <style>
      .main-table {
        width: 30%;
        table-layout: fixed;
        border-spacing: 1em;
        margin: 1rem auto;
      }
      .main-cell {
        height: 120px;
        width: 120px;
        text-align: center;
        vertical-align: middle;

        border: 8px solid #baad9f;
        border-collapse: collapse;

        margin: 8px;
        border-radius: 10px;
        border-collapse: collapse;

        font-size: 400%;
        font-family: Helvetica;
      }
      .cellEmpty { background: #d6cdc4; }
      .cell2     { background: #eee3d9; color: #746b60; }
      .cell4     { background: #ecdec6; color: #746b60; }
      .cell8     { background: #f2b179; color: #fef6f7; }
      .cell16    { background: #f49561; color: #fef6f7; }
      .cell32    { background: #f67d5e; color: #fef6f7; }
      .cell64    { background: #ff583b; color: #fef6f7; }
      .cell128   { background: #edce74; color: #fef6f7; }
      .cell256   { background: #edcd61; color: #fef6f7; }
      .cell512   { background: #ecc850; color: #fef6f7; }
      .cell1024  { background: #edc53f; color: #fef6f7; }
      .cell2048  { background: #eec22e; color: #fef6f7; }
      .cellLarge { background: #3e3932; color: #fef6f7; }
    </style>

  </head>

  <body>
    <script src="Game2k48.js"></script>
  </body>

</html>
