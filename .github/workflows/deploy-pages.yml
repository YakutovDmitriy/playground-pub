name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "game2k48/**"
      - "f1-elo/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build 2048
        working-directory: game2k48
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: ./gradlew browserProductionWebpack

      - name: Assemble Pages
        run: |
          mkdir _site

          mkdir -p _site/2048
          cp -R game2k48/build/distributions/. _site/2048

          mkdir -p _site/f1-elo
          rsync -a \
              --exclude=.git \
              f1-elo/ _site/f1-elo/

      - uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
